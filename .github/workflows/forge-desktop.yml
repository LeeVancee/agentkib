name: Electron Forge Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make:
    name: Forge ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-15
            artifact: macos-arm64
          - name: Windows x64
            os: windows-2025
            artifact: windows-x64
          - name: Linux x64
            os: ubuntu-22.04
            artifact: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux maker dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils fakeroot pkg-config rpm libssl-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.17.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust and quota collector
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: forge-${{ matrix.artifact }}
          cache-directories: ~/.cache/agentkib/codexbar/0.49.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Make Forge distributables
        run: pnpm dist:forge

      - name: Upload Forge artifacts
        uses: actions/upload-artifact@v7
        with:
          name: agentkib-forge-${{ matrix.artifact }}
          path: apps/desktop/release-forge/make/**/*
          if-no-files-found: error
