appId: ai.agentkib
productName: AgentKib
directories:
  output: release-electron
files:
  - dist/**
  - dist-electron/**
extraResources:
  - from: build/runtime
    to: bin
  - from: build/quota
    to: bin
  - from: src-tauri/resources/CodexBar_CodexBarCore.bundle
    to: CodexBar_CodexBarCore.bundle
  - from: src-tauri/resources/linux
    to: linux
  - from: src-tauri/resources/windows
    to: windows
  - from: src-tauri/icons/tray-icon.png
    to: icons/tray-icon.png
mac:
  icon: src-tauri/icons/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  minimumSystemVersion: 13.3.0
  target:
    - dmg
    - zip
  artifactName: AgentKib_${version}_macos-${arch}.${ext}
win:
  icon: src-tauri/icons/icon.ico
  target:
    - nsis
  artifactName: AgentKib_${version}_windows-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
linux:
  icon: src-tauri/icons/icon.png
  category: Development
  target:
    - AppImage
    - deb
    - rpm
  artifactName: AgentKib_${version}_linux-${arch}.${ext}
publish:
  provider: github
  owner: starroyhq
  repo: agentkib
