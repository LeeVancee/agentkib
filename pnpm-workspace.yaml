packages:
  - apps/*
  - packages/*

# Security floors for transitive dependencies (Dependabot and pnpm audit).
overrides:
  '@modelcontextprotocol/sdk@>=1.12.0 <1.31.0': 1.31.0
  'fast-uri@>=3.0.0 <3.1.6': 3.1.6
  'qs@>=2.2.5 <6.16.0': 6.16.0
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'hono@<4.13.5': 4.13.5

allowBuilds:
  electron-winstaller: true
  koffi: true

minimumReleaseAgeExclude:
  - vite@8.3.4
