appId: ai.agentkib
productName: AgentKib
executableName: AgentKib
directories:
  output: release-electron
files:
  - dist/**
  - dist-electron/**
  - "!**/*.map"
  - "!**/*.tsbuildinfo"
  - "!**/.DS_Store"
electronLanguages:
  - en-US
  - ja
  - zh-CN
  - zh-TW
compression: maximum
extraResources:
  - from: build/runtime
    to: bin
  - from: build/quota
    to: bin
  - from: resources/quota/resources/CodexBar_CodexBarCore.bundle
    to: CodexBar_CodexBarCore.bundle
  - from: resources/quota/resources/linux
    to: bin/linux
  - from: resources/quota/resources/windows
    to: windows
  - from: resources/icons/tray-icon.png
    to: icons/tray-icon.png
  - from: resources/icons/app-icon-white.png
    to: icons/app-icon-white.png
  - from: resources/icons/app-icon-black.png
    to: icons/app-icon-black.png
  - from: resources/icons/app-icon-white-macos.png
    to: icons/app-icon-white-macos.png
  - from: resources/icons/app-icon-black-macos.png
    to: icons/app-icon-black-macos.png
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  minimumSystemVersion: 13.3.0
  target:
    - dmg
    - zip
  artifactName: AgentKib_${version}_macos-${arch}.${ext}
win:
  icon: resources/icons/icon.ico
  target:
    - nsis
  artifactName: AgentKib_${version}_windows-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
linux:
  icon: resources/icons/icon.png
  category: Development
  maintainer: AgentKib contributors
  vendor: AgentKib
  target:
    - AppImage
    - deb
    - rpm
  artifactName: AgentKib_${version}_linux-${arch}.${ext}
publish:
  provider: github
  owner: starroyhq
  repo: agentkib
